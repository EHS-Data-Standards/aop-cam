name: aop_cam
description: 'Adverse Outcome Pathways represented as causal activity models, following
  the GO-CAM paradigm: an AOP is a model (a named causal graph), each Key Event is
  a node defined by associations to ontology terms in context, each Key Event Relationship
  is a typed causal association drawn from the Relation Ontology, and evidence attaches
  to individual assertions rather than to whole records. The schema mirrors the GO-CAM
  pattern (Association hierarchy, per-assertion evidence, model lifecycle) without
  importing its gene-product machinery: a Key Event is not a molecular Activity, and
  the AOP extensions GO-CAM lacks - direction of change as node state, levels of biological
  organization up to population, and compositional outcome grounding with optional
  precomposed-term mappings - are first-class here. Instances can be loaded from AOP-Wiki
  exports; aopwiki_id slots keep the crosswalk.'
title: AOP Causal Activity Models
id: https://w3id.org/EHS-Data-Standards/aop-cam
imports:
- linkml:types
license: BSD-3
