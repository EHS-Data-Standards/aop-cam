    slot_uri: aop_cam:id
    identifier: true
    alias: id
    owner: KeyEventNode
    domain_of:
    - KeyEventNode
    range: uriorcurie
    required: true
  keyEventNode__title:
    name: keyEventNode__title
    description: Human-readable name of the key event.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:title
