    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:stressors
    alias: stressors
    owner: AopModel
    domain_of:
    - AopModel
    range: StressorTermObject
    multivalued: true
    inlined: true
    inlined_as_list: true
  aopModel__comments:
    name: aopModel__comments
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:comments
    alias: comments
    owner: AopModel
    domain_of:
    - AopModel
    range: string
    multivalued: true
  aopModel__provenances:
    name: aopModel__provenances
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:provenances
    alias: provenances
    owner: AopModel
    domain_of:
    - AopModel
    range: ProvenanceInfo
    multivalued: true
    inlined: true
    inlined_as_list: true
  keyEventNode__id:
