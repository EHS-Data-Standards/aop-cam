classes:
  ModelCollection:
    name: ModelCollection
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/ModelCollection
    description: Root container for a set of AOP causal activity models, e.g. one
      release of models converted from an AOP-Wiki snapshot, or a curated network
      slice.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slots:
    - modelCollection__models
    - modelCollection__snapshot_date
    attributes:
      models:
        name: models
        description: The models in this collection.
        range: AopModel
        multivalued: true
        inlined_as_list: true
      snapshot_date:
        name: snapshot_date
        description: Date of the AOP-Wiki snapshot these models were derived from,
          when applicable. Nightly dumps are overwritten daily, so cite a quarterly
          dump date wherever possible.
        range: date
    class_uri: aop_cam:ModelCollection
    tree_root: true
  AopModel:
    name: AopModel
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/AopModel
    description: 'One Adverse Outcome Pathway as a causal activity model: a named
      graph of Key Event nodes connected by typed causal associations. Initial nodes
      (no incoming causal association) are molecular initiating events; terminal nodes
      (no outgoing causal association) are adverse outcomes. The event_type on each
      node states the curator''s intent; the graph position is checkable against it.'
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slots:
    - aopModel__id
    - aopModel__title
    - aopModel__description
    - aopModel__aopwiki_id
    - aopModel__status
    - aopModel__oecd_status
    - aopModel__taxa
    - aopModel__key_events
    - aopModel__stressors
    - aopModel__comments
    - aopModel__provenances
    attributes:
      id:
        name: id
        identifier: true
        range: uriorcurie
      title:
        name: title
        description: Human-readable title of the model.
        slot_uri: dcterms:title
        required: true
      description:
        name: description
        range: string
      aopwiki_id:
        name: aopwiki_id
        description: AOP-Wiki identifier for this AOP (e.g. "Aop:425").
        range: string
      status:
        name: status
        description: Lifecycle status of the model.
        range: ModelStateEnum
      oecd_status:
        name: oecd_status
        description: OECD endorsement status, carried over from AOP-Wiki.
        range: string
      taxa:
        name: taxa
        description: Taxa this model is asserted to apply to.
        range: TaxonTermObject
        multivalued: true
        inlined_as_list: true
      key_events:
        name: key_events
        description: All Key Event nodes in this model.
        range: KeyEventNode
        multivalued: true
        inlined_as_list: true
      stressors:
        name: stressors
        description: Chemical or physical stressors known to trigger this pathway,
          as ontology term references where possible.
        range: StressorTermObject
        multivalued: true
        inlined_as_list: true
      comments:
        name: comments
        range: string
        multivalued: true
      provenances:
        name: provenances
        range: ProvenanceInfo
        multivalued: true
        inlined_as_list: true
    class_uri: aop_cam:AopModel
    rules:
    - preconditions:
        slot_conditions:
          status:
            name: status
            equals_string: production
      postconditions:
        slot_conditions:
          key_events:
            name: key_events
            required: true
      title: Production models must have key events
  KeyEventNode:
    name: KeyEventNode
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/KeyEventNode
    description: 'One Key Event as a node in a causal activity model. The node itself
      is only an identifier and a label; its meaning comes from its associations -
      one or more entity+quality components (the biological process affected and/or
      the object acted on, with the direction of change) plus the cellular and anatomical
      context - each assignment carrying its own evidence. An adverse outcome is a
      terminal KeyEventNode: its composition defines it, and outcome_mappings optionally
      decorate it with precomposed phenotype or disease terms where any exist.'
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slots:
    - keyEventNode__id
    - keyEventNode__title
    - keyEventNode__aopwiki_id
    - keyEventNode__event_type
    - keyEventNode__level_of_biological_organization
    - keyEventNode__components
    - keyEventNode__occurs_in_cell_type
    - keyEventNode__occurs_in_anatomy
    - keyEventNode__causal_associations
    - keyEventNode__outcome_mappings
    - keyEventNode__provenances
    attributes:
      id:
        name: id
        identifier: true
        range: uriorcurie
      title:
        name: title
        description: Human-readable name of the key event.
        required: true
      aopwiki_id:
        name: aopwiki_id
        description: AOP-Wiki identifier for this key event (e.g. "Event:1656").
        range: string
      event_type:
        name: event_type
        description: 'The curator-asserted role of this node in the pathway. Must
          be consistent with graph position: a molecular_initiating_event has no incoming
          causal associations, an adverse_outcome has no outgoing ones.'
        range: EventTypeEnum
      level_of_biological_organization:
        name: level_of_biological_organization
        range: LevelOfBiologicalOrganizationEnum
      components:
        name: components
        description: 'The entity+quality decompositions of this key event. Mirrors
          AOP-Wiki''s biological-event triples (action, process, object): most key
          events have exactly one; some carry several complementary decompositions
          of the same change, so the pairing of direction with process and object
          is preserved per component.'
        range: KeyEventComponent
        multivalued: true
        inlined_as_list: true
      occurs_in_cell_type:
        name: occurs_in_cell_type
        range: CellTypeAssociation
        inlined: true
      occurs_in_anatomy:
        name: occurs_in_anatomy
        range: GrossAnatomyAssociation
        inlined: true
      causal_associations:
        name: causal_associations
        description: The causal associations that flow out of this node. A node with
          none is terminal in the model; a node no other node points at is initial.
        range: CausalAssociation
        multivalued: true
        inlined_as_list: true
      outcome_mappings:
        name: outcome_mappings
        description: 'For adverse outcome nodes: precomposed terms equivalent or close
          to this outcome''s compositional definition, where any exist (HPO phenotype,
          MONDO disease, or uPheno class). A decoration for discovery, not the definition;
          candidates can be generated by matching the node''s entity+quality composition
          against uPheno''s pattern space.'
        range: uriorcurie
        multivalued: true
        pattern: ^(HP:\d{7}|MONDO:\d{7}|UPHENO:\d+)$
      provenances:
        name: provenances
        range: ProvenanceInfo
        multivalued: true
        inlined_as_list: true
    class_uri: aop_cam:KeyEventNode
  KeyEventComponent:
    name: KeyEventComponent
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/KeyEventComponent
    description: 'One entity+quality decomposition of a key event: the biological
      process perturbed and/or the object acted on (the entity), paired with the direction
      of change (the quality). Mirrors one AOP-Wiki biological-event triple (action
      + process + object). Each leg is an Association carrying its own evidence receipt;
      the component holds them together so a key event with several decompositions
      keeps each direction attached to the process and object it belongs with.'
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slots:
    - keyEventComponent__process
    - keyEventComponent__object
    - keyEventComponent__direction
    attributes:
      process:
        name: process
        description: The biological process this component perturbs.
        range: ProcessAssociation
        inlined: true
      object:
        name: object
        description: The biological object (molecule, cell, structure) acted on.
        range: ObjectAssociation
        inlined: true
      direction:
        name: direction
        description: The direction of change, as a PATO quality.
        range: DirectionAssociation
        inlined: true
    class_uri: aop_cam:KeyEventComponent
  Association:
    name: Association
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/Association
    description: An individual assertion in a model, carrying its own evidence and
      provenance. Every term assignment and every causal edge is an Association subtype,
      so support attaches to the claim itself rather than to the record that contains
      it.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    abstract: true
    slots:
    - association__type
    - association__evidence
    - association__provenances
    attributes:
      type:
        name: type
        description: Auto-populated association type discriminator.
        designates_type: true
      evidence:
        name: evidence
        range: EvidenceItem
        multivalued: true
        inlined_as_list: true
      provenances:
        name: provenances
        range: ProvenanceInfo
        multivalued: true
        inlined_as_list: true
    class_uri: aop_cam:Association
  TermAssociation:
    name: TermAssociation
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/TermAssociation
    description: An association between a node and an ontology term. Abstract; use
      the typed subclasses so each dimension constrains its vocabulary.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: Association
    abstract: true
    slots:
    - association__type
    - association__evidence
    - association__provenances
    - term
    class_uri: aop_cam:TermAssociation
  ProcessAssociation:
    name: ProcessAssociation
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/ProcessAssociation
    description: Associates a key event with the biological process it perturbs.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermAssociation
    slots:
    - association__type
    - association__evidence
    - association__provenances
    - ProcessAssociation_term
    slot_usage:
      term:
        name: term
        range: ProcessTermObject
    class_uri: aop_cam:ProcessAssociation
  ObjectAssociation:
    name: ObjectAssociation
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/ObjectAssociation
    description: Associates a key event with the biological object acted on (a protein,
      chemical, cell component, or other entity).
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermAssociation
    slots:
    - association__type
    - association__evidence
    - association__provenances
    - ObjectAssociation_term
    slot_usage:
      term:
        name: term
        range: ObjectTermObject
    class_uri: aop_cam:ObjectAssociation
  DirectionAssociation:
    name: DirectionAssociation
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/DirectionAssociation
    description: Associates a key event with the direction of change, as a PATO quality
      (e.g. increased amount, decreased functionality). Together with the process
      or object this forms the entity+quality decomposition of the event.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermAssociation
    slots:
    - association__type
    - association__evidence
    - association__provenances
    - DirectionAssociation_term
    slot_usage:
      term:
        name: term
        range: DirectionTermObject
    class_uri: aop_cam:DirectionAssociation
  CellTypeAssociation:
    name: CellTypeAssociation
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/CellTypeAssociation
    description: The cell type in which the key event occurs.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermAssociation
    slots:
    - association__type
    - association__evidence
    - association__provenances
    - CellTypeAssociation_term
    slot_usage:
      term:
        name: term
        range: CellTypeTermObject
    class_uri: aop_cam:CellTypeAssociation
  GrossAnatomyAssociation:
    name: GrossAnatomyAssociation
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/GrossAnatomyAssociation
    description: The anatomical location in which the key event occurs.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermAssociation
    slots:
    - association__type
    - association__evidence
    - association__provenances
    - GrossAnatomyAssociation_term
    slot_usage:
      term:
        name: term
        range: AnatomyTermObject
    class_uri: aop_cam:GrossAnatomyAssociation
  CausalAssociation:
    name: CausalAssociation
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/CausalAssociation
    description: 'A typed causal edge between two key event nodes: the AOP framework''s
      Key Event Relationship, with the relation drawn from the causal branch of the
      Relation Ontology. AOP-Wiki adjacency maps onto the predicate: adjacent KERs
      are immediately causally upstream of; non-adjacent KERs are causally upstream
      of; use the positive/negative effect or regulates forms where the direction
      of influence is curated.'
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: Association
    slots:
    - association__type
    - association__evidence
    - association__provenances
    - causalAssociation__predicate
    - causalAssociation__downstream_event
    - causalAssociation__aopwiki_ker_id
    - causalAssociation__evidence_level
    - causalAssociation__quantitative_understanding
    attributes:
      predicate:
        name: predicate
        description: The RO causal relation for this edge.
        range: CausalPredicateEnum
        required: true
      downstream_event:
        name: downstream_event
        description: The key event node this edge points to.
        range: KeyEventNode
        required: true
        inlined: false
      aopwiki_ker_id:
        name: aopwiki_ker_id
        description: AOP-Wiki identifier for this relationship (e.g. "Relationship:2555").
        range: string
      evidence_level:
        name: evidence_level
        description: Weight of evidence for this relationship, as curated.
        range: ConfidenceLevelEnum
      quantitative_understanding:
        name: quantitative_understanding
        range: ConfidenceLevelEnum
    class_uri: aop_cam:CausalAssociation
  EvidenceItem:
    name: EvidenceItem
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/EvidenceItem
    description: 'One piece of evidence supporting an assertion: an ECO evidence type,
      a publication, and optionally the supporting records themselves - for example
      the identifier of a SOMA assay whose measurements inform the assertion. This
      is the joint between the knowledge layer (this schema) and the experimental
      evidence layer (SOMA): an assay''s informs_on_key_event link materializes here
      as evidence on the node''s association.'
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slots:
    - evidenceItem__term
    - evidenceItem__reference
    - evidenceItem__supporting_objects
    - evidenceItem__description
    - evidenceItem__provenances
    attributes:
      term:
        name: term
        description: The ECO term for the type of evidence.
        range: uriorcurie
        pattern: ^ECO:\d{7}$
      reference:
        name: reference
        description: The publication the evidence comes from (PMID, DOI, or AOPWIKI
          page).
        range: uriorcurie
      supporting_objects:
        name: supporting_objects
        description: Identifiers of supporting records, such as SOMA assay instances
          or database entities.
        range: uriorcurie
        multivalued: true
      description:
        name: description
        range: string
      provenances:
        name: provenances
        range: ProvenanceInfo
        multivalued: true
        inlined_as_list: true
    class_uri: aop_cam:EvidenceItem
  ProvenanceInfo:
    name: ProvenanceInfo
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/ProvenanceInfo
    description: Who made or changed an assertion, and when.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slots:
    - provenanceInfo__contributor
    - provenanceInfo__created
    - provenanceInfo__modified
    - provenanceInfo__source
    attributes:
      contributor:
        name: contributor
        range: string
      created:
        name: created
        range: datetime
      modified:
        name: modified
        range: datetime
      source:
        name: source
        description: Where this content came from, e.g. "AOPWiki" for converted content
          or a curation project name for new assertions.
        range: string
    class_uri: aop_cam:ProvenanceInfo
  TermObject:
    name: TermObject
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/TermObject
    description: 'A pointer to an ontology term: an identifier plus its label. Typed
      subclasses constrain which vocabulary each slot draws from.'
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    abstract: true
    slots:
    - id
    - label
    class_uri: aop_cam:TermObject
  ProcessTermObject:
    name: ProcessTermObject
    id_prefixes:
    - GO
    - MESH
    - HP
    - MP
    - VT
    - NBO
    - MI
    - PCO
    - RBO
    - IDO
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/ProcessTermObject
    description: A biological process term. GO preferred; the other sources in AOP-Wiki's
      biological-process vocabulary (MESH, HP, MP, VT, NBO and kin) are accepted for
      conversion so the upstream assertion is kept verbatim, with re-grounding to
      GO left to curation.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermObject
    slots:
    - id
    - label
    class_uri: aop_cam:ProcessTermObject
  ObjectTermObject:
    name: ObjectTermObject
    id_prefixes:
    - PR
    - CHEBI
    - GO
    - MESH
    - CL
    - UBERON
    - FMA
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/ObjectTermObject
    description: A biological object term (protein, chemical, cell, anatomical structure,
      or other entity). AOP-Wiki's biological-object vocabulary also draws on CL,
      UBERON and FMA; those assertions are kept verbatim.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermObject
    slots:
    - id
    - label
    class_uri: aop_cam:ObjectTermObject
  DirectionTermObject:
    name: DirectionTermObject
    id_prefixes:
    - PATO
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/DirectionTermObject
    description: A PATO quality term for the direction of change.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermObject
    slots:
    - label
    - DirectionTermObject_id
    slot_usage:
      id:
        name: id
        pattern: ^PATO:\d{7}$
    class_uri: aop_cam:DirectionTermObject
  CellTypeTermObject:
    name: CellTypeTermObject
    id_prefixes:
    - CL
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/CellTypeTermObject
    description: A Cell Ontology term.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermObject
    slots:
    - label
    - CellTypeTermObject_id
    slot_usage:
      id:
        name: id
        pattern: ^CL:\d{7}$
    class_uri: aop_cam:CellTypeTermObject
  AnatomyTermObject:
    name: AnatomyTermObject
    id_prefixes:
    - UBERON
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/AnatomyTermObject
    description: An UBERON anatomy term.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermObject
    slots:
    - label
    - AnatomyTermObject_id
    slot_usage:
      id:
        name: id
        pattern: ^UBERON:\d{7}$
    class_uri: aop_cam:AnatomyTermObject
  TaxonTermObject:
    name: TaxonTermObject
    id_prefixes:
    - NCBITaxon
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/TaxonTermObject
    description: An NCBI Taxonomy term.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermObject
    slots:
    - label
    - TaxonTermObject_id
    slot_usage:
      id:
        name: id
        pattern: ^NCBITaxon:\d+$
    class_uri: aop_cam:TaxonTermObject
  StressorTermObject:
    name: StressorTermObject
    id_prefixes:
    - CHEBI
    - MESH
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/StressorTermObject
    description: A stressor as an ontology term reference where one exists (CHEBI
      chemical, or an environmental material); free-text stressor names from AOP-Wiki
      that cannot be grounded keep their label with an AOPWIKI-prefixed id.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    is_a: TermObject
    slots:
    - id
    - label
    class_uri: aop_cam:StressorTermObject
