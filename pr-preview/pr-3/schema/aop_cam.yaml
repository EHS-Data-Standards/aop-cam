    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:taxa
    alias: taxa
    owner: AopModel
    domain_of:
    - AopModel
    range: TaxonTermObject
    multivalued: true
    inlined: true
    inlined_as_list: true
  aopModel__key_events:
    name: aopModel__key_events
