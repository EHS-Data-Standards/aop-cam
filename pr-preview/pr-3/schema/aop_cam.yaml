types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ModelStateEnum:
    name: ModelStateEnum
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/ModelStateEnum
    description: Where the model is in its development life cycle (GO-CAM semantics).
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    permissible_values:
      development:
        text: development
        description: Still being worked on; not guaranteed accurate or complete.
      production:
        text: production
        description: Declared ready for public consumption.
      review:
        text: review
        description: Marked for curator review.
      archived:
        text: archived
        description: Retained for reference; no longer maintained.
  EventTypeEnum:
    name: EventTypeEnum
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/EventTypeEnum
    description: The curator-asserted role of a key event node in the pathway.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    permissible_values:
      molecular_initiating_event:
        text: molecular_initiating_event
        description: The initial perturbation; no incoming causal associations.
      key_event:
        text: key_event
        description: An intermediate measurable change.
      adverse_outcome:
        text: adverse_outcome
        description: The apical endpoint; no outgoing causal associations.
  LevelOfBiologicalOrganizationEnum:
    name: LevelOfBiologicalOrganizationEnum
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/LevelOfBiologicalOrganizationEnum
    description: Levels of biological organization, following AOP-Wiki usage.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    permissible_values:
      molecular:
        text: molecular
      cellular:
        text: cellular
      tissue:
        text: tissue
      organ:
        text: organ
      individual:
        text: individual
      population:
        text: population
  CausalPredicateEnum:
    name: CausalPredicateEnum
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/CausalPredicateEnum
    description: The causal relation between two key events, drawn from the "causally
      upstream or within" branch of the Relation Ontology. Permissible values and
      meanings follow the GO-CAM schema's CausalPredicateEnum.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    permissible_values:
      causally upstream of, positive effect:
        text: causally upstream of, positive effect
        meaning: RO:0002304
      causally upstream of, negative effect:
        text: causally upstream of, negative effect
        meaning: RO:0002305
      causally upstream of:
        text: causally upstream of
        meaning: RO:0002411
      immediately causally upstream of:
        text: immediately causally upstream of
        meaning: RO:0002412
      causally upstream of or within:
        text: causally upstream of or within
        meaning: RO:0002418
      regulates:
        text: regulates
        meaning: RO:0002211
      negatively regulates:
        text: negatively regulates
        meaning: RO:0002212
      positively regulates:
        text: positively regulates
        meaning: RO:0002213
  ConfidenceLevelEnum:
    name: ConfidenceLevelEnum
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/ConfidenceLevelEnum
    description: Curated confidence levels, following AOP-Wiki usage.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    permissible_values:
      high:
        text: high
      moderate:
        text: moderate
      low:
        text: low
      not_specified:
        text: not_specified
slots:
  id:
    name: id
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/id
    description: A unique identifier.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:id
    identifier: true
    owner: TermObject
    domain_of:
    - TermObject
    range: uriorcurie
    required: true
  label:
    name: label
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/label
    description: The human-readable label of the term, as given by its ontology.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:label
    owner: TermObject
    domain_of:
    - TermObject
    range: string
  term:
    name: term
    definition_uri: https://w3id.org/EHS-Data-Standards/aop-cam/term
    description: The ontology term this association assigns.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:term
    owner: TermAssociation
    domain_of:
    - TermAssociation
    range: TermObject
    inlined: true
    inlined_as_list: false
  modelCollection__models:
    name: modelCollection__models
    description: The models in this collection.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:models
    alias: models
    owner: ModelCollection
    domain_of:
    - ModelCollection
    range: AopModel
    multivalued: true
    inlined: true
    inlined_as_list: true
  modelCollection__snapshot_date:
    name: modelCollection__snapshot_date
    description: Date of the AOP-Wiki snapshot these models were derived from, when
      applicable. Nightly dumps are overwritten daily, so cite a quarterly dump date
      wherever possible.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:snapshot_date
    alias: snapshot_date
    owner: ModelCollection
    domain_of:
    - ModelCollection
    range: date
  aopModel__id:
    name: aopModel__id
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:id
    identifier: true
    alias: id
    owner: AopModel
    domain_of:
    - AopModel
    range: uriorcurie
    required: true
  aopModel__title:
    name: aopModel__title
    description: Human-readable title of the model.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    mappings:
    - dcterms:title
    slot_uri: dcterms:title
    alias: title
    owner: AopModel
    domain_of:
    - AopModel
    range: string
    required: true
  aopModel__description:
    name: aopModel__description
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:description
    alias: description
    owner: AopModel
    domain_of:
    - AopModel
    range: string
  aopModel__aopwiki_id:
    name: aopModel__aopwiki_id
    description: AOP-Wiki identifier for this AOP (e.g. "Aop:425").
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:aopwiki_id
    alias: aopwiki_id
    owner: AopModel
    domain_of:
    - AopModel
    range: string
  aopModel__status:
    name: aopModel__status
    description: Lifecycle status of the model.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:status
    alias: status
    owner: AopModel
    domain_of:
    - AopModel
    range: ModelStateEnum
  aopModel__oecd_status:
    name: aopModel__oecd_status
    description: OECD endorsement status, carried over from AOP-Wiki.
    from_schema: https://w3id.org/EHS-Data-Standards/aop-cam
    slot_uri: aop_cam:oecd_status
    alias: oecd_status
    owner: AopModel
    domain_of:
    - AopModel
    range: string
  aopModel__taxa:
